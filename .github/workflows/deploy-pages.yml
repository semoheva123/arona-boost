name: Deploy Arona Boost to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Build production bundle for GitHub Pages
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_LOWER: ${{ github.repository_owner }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://pqzvkhwxarwwcsquhrea.supabase.co/functions/v1/arona-api' }}
        run: |
          if [ "$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')" = "$(echo "${OWNER_LOWER}.github.io" | tr '[:upper:]' '[:lower:]')" ]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${REPO_NAME}/"
          fi
          npx vite build --config vite.config.mjs --outDir pages_dist
          node -e '
            const fs = require("fs");
            const path = require("path");
            const base = process.env.VITE_BASE_PATH || "/";
            if (base !== "/") {
              const fixFile = (p) => {
                let s = fs.readFileSync(p, "utf8");
                s = s.replace(/(["\x27])\/(corporate|destinations|sw\.js|manifest\.json|icon\.svg)/g, `$1${base}$2`);
                fs.writeFileSync(p, s);
              };
              fixFile("pages_dist/index.html");
              for (const f of fs.readdirSync("pages_dist/assets")) {
                if (f.endsWith(".js") || f.endsWith(".css")) {
                  fixFile(path.join("pages_dist/assets", f));
                }
              }
            }
          '
          cp pages_dist/index.html pages_dist/404.html
          touch pages_dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages_dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
